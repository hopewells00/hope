[supervisord]
nodaemon=true
logfile=supervisord.log
pidfile=supervisord.pid

[program:hope-bot]
command=python -u main.py
directory=%(here)s
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; main.py owns bot.log and bot-error.log so RotatingFileHandler can rotate them safely.
stdout_logfile=NONE
stderr_logfile=NONE